     <meta name="description" content="Contact Shehroz Riaz by email, GitHub or LinkedIn, or send a message with the form.">

    <body>

<header>
<h1>Shehroz Riaz</h1>

     <main>
<div class="row">

    <div class="col-8">
        <section>
            <h2>Send Me a Message</h2>
            <form action="mailto:zorhehs@gmail.com" method="post" enctype="text/plain">
                <fieldset>
                    <legend>Contact Form</legend>

                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" autocomplete="name" required minlength="3" maxlength="40">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>

                    <label for="reason">Reason</label>
                    <select id="reason" name="reason">
                        <option value="internship">Internship</option>
                        <option value="project">Project</option>
                        <option value="hello">Just saying hello</option>
                    </select>

                    <span class="group-label" id="who-label">I am a</span>
                    <div role="group" aria-labelledby="who-label">
                    <label class="radio-label"><input type="radio" name="who" value="recruiter"> Recruiter</label>
                    <label class="radio-label"><input type="radio" name="who" value="classmate"> Classmate</label>
                    <label class="radio-label"><input type="radio" name="who" value="other" checked> Other</label>
                    </div>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" required minlength="10"></textarea>

                    <button type="submit">Send</button>
                </fieldset>
            </form>
        </section>
    </div>

    <div class="col-4">
<aside>
    <section>
        <h2>Find Me</h2>
        <address>
            <a href="mailto:zorhehs@gmail.com">zorhehs@gmail.com</a><br>
            <a href="https://github.com/zorhehs" target="_blank" rel="noopener noreferrer">github.com/zorhehs</a><br>
            <a href="https://linkedin.com/in/zorhehs" target="_blank" rel="noopener noreferrer">linkedin.com/in/zorhehs</a>
        </address>
    </section>
</aside>
    </div>

</div>
     </main>
